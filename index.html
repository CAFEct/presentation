<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esmalt'up — Apresentação</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>
<style>
:root{
  --bg:#120b11; --rose:#f0a9bf; --rose2:#d9708f; --deep:#b84a64; --text:#fbeef3; --muted:#c3a9b4;
  --gold:#ffd98a; --mint:#7ef0c3; --red:#ff5b78; --blue:#8ec5ff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#07040a;font-family:Poppins,system-ui,sans-serif;color:var(--text)}
#root{position:absolute;inset:0}
#stage{position:absolute;top:50%;left:50%;width:1280px;height:720px;transform-origin:center;background:var(--bg);overflow:hidden;border-radius:8px;box-shadow:0 0 120px rgba(217,112,143,.25)}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(240,169,191,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(240,169,191,.05) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 50% 50%,#000 20%,transparent 75%)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.scene{position:absolute;inset:0;padding:70px 76px 64px;display:flex;flex-direction:column;justify-content:center;perspective:1400px;transform-style:preserve-3d}
/* vidro */
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.04));backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.18);border-radius:22px;box-shadow:0 24px 50px -12px rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.04);padding:22px 24px;overflow:hidden}
.glass::before{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-20deg);transition:left .9s ease}
.glass:hover::before{left:130%}
/* LED */
.led{--c:var(--rose);display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 5px var(--c);opacity:.9;flex:none}
.neon{text-shadow:none}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--rose);font-weight:600;letter-spacing:.2em;font-size:13px;text-transform:uppercase;margin-bottom:12px}
h1{font-size:112px;font-weight:800;line-height:1;background:linear-gradient(90deg,#ffd0de,#f0a9bf 45%,#d9708f);-webkit-background-clip:text;background-clip:text;color:transparent;}
h2{font-size:42px;font-weight:700;line-height:1.12;margin-bottom:24px}
h2 em{font-style:normal;color:var(--rose)}
.lead{font-size:22px;line-height:1.5;color:var(--muted);max-width:640px}
.grid{display:grid;gap:20px}
.c2{grid-template-columns:repeat(2,1fr)}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}.c5{grid-template-columns:repeat(5,1fr)}.c6{grid-template-columns:repeat(6,1fr)}
.card h3{font-size:19px;font-weight:700;margin:10px 0 6px}
.card p,.card li{font-size:14.5px;line-height:1.5;color:var(--muted)}
.card ul{list-style:none}
.ico{font-size:34px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.row{display:flex;align-items:center;gap:14px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500}
.price{font-size:26px;font-weight:800;color:var(--rose)}
.big{font-size:60px;font-weight:800;line-height:1;color:var(--rose)}
.btn{display:inline-block;padding:16px 38px;border-radius:999px;font-weight:700;font-size:20px;color:#fff;background:linear-gradient(180deg,#f0a9bf,#d9708f 60%,#b84a64);box-shadow:0 12px 30px rgba(217,112,143,.5),inset 0 1px 0 rgba(255,255,255,.5);cursor:pointer}
.cube{position:relative;width:170px;height:170px;transform-style:preserve-3d}
.face{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:20px;border-radius:18px;border:1px solid rgba(255,255,255,.3);background:linear-gradient(145deg,rgba(240,169,191,.28),rgba(184,74,100,.18));backdrop-filter:blur(6px);box-shadow:inset 0 0 30px rgba(240,169,191,.12)}
.hud{position:absolute;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;color:var(--muted);z-index:20}
.nav{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);border:none;cursor:pointer}
.arrow{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--text);cursor:pointer;backdrop-filter:blur(8px)}
.tag{font-size:12px;color:var(--gold);letter-spacing:.08em}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const M = window.Motion || window.FramerMotion;
if(!M){document.getElementById('root').innerHTML='<p style="color:#fff;padding:40px;font-family:sans-serif">Não foi possível carregar o Framer Motion. Verifique a conexão com a internet e recarregue.</p>';throw new Error('no framer');}
const {motion, AnimatePresence, useMotionValue, useSpring} = M;
const {useState, useEffect, useRef} = React;

const ease=[.22,1,.36,1];
const shell={
  enter:d=>({opacity:0,x:d*280,rotateY:d*-38,scale:.86}),
  center:{opacity:1,x:0,rotateY:0,scale:1,transition:{duration:.85,ease,staggerChildren:.09,delayChildren:.3}},
  exit:d=>({opacity:0,x:d*-280,rotateY:d*38,scale:.86,transition:{duration:.5,ease:[.65,0,.35,1]}})
};
const item={
  enter:{opacity:0,y:46,rotateX:-28,scale:.94},
  center:{opacity:1,y:0,rotateX:0,scale:1,transition:{type:'spring',stiffness:80,damping:15}}
};

function Tilt({children,className='',style={},strength=9,led,ledColor}){
  const rx=useMotionValue(0),ry=useMotionValue(0);
  const srx=useSpring(rx,{stiffness:140,damping:14}),sry=useSpring(ry,{stiffness:140,damping:14});
  const move=e=>{const r=e.currentTarget.getBoundingClientRect();const px=(e.clientX-r.left)/r.width-.5,py=(e.clientY-r.top)/r.height-.5;ry.set(px*strength*2);rx.set(-py*strength*2)};
  const leave=()=>{rx.set(0);ry.set(0)};
  return (
    <motion.div variants={item} style={{transformStyle:'preserve-3d',...style}}>
      <motion.div className={'glass card '+className} style={{rotateX:srx,rotateY:sry,transformStyle:'preserve-3d',height:'100%','--c':ledColor||'var(--rose)'}}
        whileHover={{scale:1.03,y:-4,boxShadow:'0 30px 60px -12px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.3)'}}
        transition={{type:'spring',stiffness:200,damping:18}}
        onMouseMove={move} onMouseLeave={leave}>
        <div style={{transform:'translateZ(26px)',height:'100%'}}>{children}</div>
      </motion.div>
    </motion.div>
  );
}
const Eyebrow=({children,color})=>(
  <motion.div variants={item} className="eyebrow"><span className="led" style={{'--c':color||'var(--rose)'}}/>{children}</motion.div>
);
const H2=({children})=><motion.h2 variants={item}>{children}</motion.h2>;
const Lead=({children,style})=><motion.p variants={item} className="lead" style={style}>{children}</motion.p>;
const Led=({c,delay=0})=><span className="led" style={{'--c':c,animationDelay:delay+'s'}}/>;

function Counter({to,dur=1600}){
  const [v,setV]=useState(0);
  useEffect(()=>{let s=null,raf;const t=ts=>{if(!s)s=ts;const p=Math.min((ts-s-700)/dur,1);setV(p<0?0:Math.round(to*(1-Math.pow(1-p,3))));if(p<1)raf=requestAnimationFrame(t)};raf=requestAnimationFrame(t);return()=>cancelAnimationFrame(raf)},[to]);
  return <>{v}</>;
}

/* ---------- SLIDES ---------- */

  const faces=['Kits','Peças','Curso','Certificado'];
  return (
    <div style={{display:'flex',alignItems:'center',gap:30}}>
      <div style={{flex:1.5}}>
        <Eyebrow>Kits de manicure · Peças avulsas · Curso</Eyebrow>
        <motion.h1 variants={item}>Esmalt'up</motion.h1>
        <Lead style={{marginTop:18}}>Uma forma completa de começar sua carreira como profissional de unhas.</Lead>
        <motion.div variants={item} style={{marginTop:30,display:'flex',gap:12,flexWrap:'wrap'}}>
          {[['Kits','var(--rose)'],['Peças avulsas','var(--blue)'],['Curso profissional','var(--mint)']].map(([t,c],i)=>(
            <motion.span key={t} className="glass chip" style={{'--c':c,padding:'10px 18px'}} whileHover={{scale:1.08,y:-4}}><Led c={c} delay={i*.4}/>{t}</motion.span>
          ))}
        </motion.div>
        <motion.p variants={item} className="tag" style={{marginTop:26}}>[Nomes da equipe] · [Disciplina] · [Professor(a)]</motion.p>
      </div>
      <motion.div variants={item} style={{flex:.9,display:'grid',placeItems:'center',perspective:900,height:360}}>
        <motion.div className="cube" animate={{rotateY:360,rotateX:[-18,18,-18]}} transition={{rotateY:{duration:20,repeat:Infinity,ease:'linear'},rotateX:{duration:10,repeat:Infinity,ease:'easeInOut'}}}>
          {faces.map((f,i)=><div key={f} className="face" style={{transform:`rotateY(${i*90}deg) translateZ(85px)`}}>{f}</div>)}
          <div className="face" style={{transform:'rotateX(90deg) translateZ(85px)',fontSize:44}}>✦</div>
          <div className="face" style={{transform:'rotateX(-90deg) translateZ(85px)',fontSize:44}}>💅</div>
        </motion.div>
      </motion.div>
    </div>
  );
}

function S2(){
  const pains=['Não sabem por onde começar','Não têm acesso a materiais de qualidade a preços acessíveis','Não encontram um curso bem estruturado','Não têm suporte para se tornarem profissionais'];
  return (<>
    <Eyebrow color="var(--red)">O problema que resolvemos</Eyebrow>
    <H2>Muitos querem aprender manicure,<br/>mas <em>enfrentam dificuldades</em></H2>

      {pains.map((p,i)=>(
        <Tilt key={p} ledColor="var(--red)"><div className="row"><Led c="var(--red)" delay={i*.3}/><p style={{fontSize:17,color:'var(--text)'}}>{p}</p></div></Tilt>
      ))}
    </div>
    <Tilt ledColor="var(--mint)" style={{}}><div className="row" style={{justifyContent:'center'}}><Led c="var(--mint)"/><span style={{fontSize:21,fontWeight:600}}>Nossa solução: <span style={{color:'var(--rose)'}}>Esmalt'up</span> — tudo em um único lugar!</span></div></Tilt>
  </>);

      <Tilt style={{flex:1}} ledColor="var(--gold)"><h3 style={{marginTop:0}}>Diferenciais</h3>{['Combinações testadas por profissionais','Preços que cabem no seu orçamento','Entrega rápida'].map(x=><div key={x} className="row" style={{margin:'10px 0',fontSize:16}}><Led c="var(--gold)"/>{x}</div>)}</Tilt>
    </div>
    <div className="grid c3">
      {kits.map(([n,t,p,c])=>(
        <Tilt key={t} ledColor={c}><small style={{color:c,letterSpacing:'.15em',fontSize:11,fontWeight:600}}>{n.toUpperCase()}</small><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}><b style={{fontSize:18}}>{t}</b><span className="price">{p}</span></div></Tilt>
      ))}
    </div>

function S5(){
  const mods=[['Unha e Segurança',6,'Materiais essenciais e biossegurança','var(--rose)'],['Cutilagem e Esmaltação',5,'Mãos e pés perfeitos','var(--blue)'],['Nail Art',4,'Decoração e francesinha','var(--mint)'],['Unhas de Gel',4,'Uma técnica premium','var(--gold)'],['Sua Carreira',4,'Como montar sua agenda','var(--red)']];

    <H2>Aprenda com as <em>melhores profissionais</em></H2>
    <div className="grid c5" style={{height:240}}>
      {mods.map(([t,n,d,c],i)=>(
        <Tilt key={t} ledColor={c}><div className="big" style={{fontSize:48,color:c,textShadow:'none'}}>{n}</div><small style={{color:'var(--muted)'}}>aulas</small><h3>{t}</h3><p>{d}</p></Tilt>
      ))}

      {mods.flatMap(([,n,,c])=>Array.from({length:n},(_,k)=>c)).map((c,i)=>(
        <motion.div key={i} initial={{scaleY:0,opacity:0}} animate={{scaleY:1,opacity:1}} transition={{delay:.9+i*.05}} style={{flex:1,height:10,borderRadius:3,background:c,opacity:.85}}/>
      ))}
    </motion.div>
    <motion.div variants={item} className="row" style={{justifyContent:'space-between'}}>
      <span style={{fontSize:20}}><b className="neon" style={{color:'var(--rose)',fontSize:30}}><Counter to={23}/></b> aulas em vídeo + certificado</span>
      <span style={{fontSize:14,color:'var(--muted)'}}>4–6 semanas · no seu ritmo · comunidade exclusiva</span>
    </motion.div>

}

  const b=[['🏅','Certificado Oficial','Mostra seu conhecimento e compromisso','var(--gold)'],['📱','Rede de profissionais','Conecta você com outros artistas','var(--blue)'],['💼','Guia para sua carreira','Aprenda a atrair e fidelizar clientes','var(--mint)'],['📸','Portfólio online','Mostre seu trabalho','var(--rose)']];
  return (<>

    <div className="grid c2" style={{marginBottom:22}}>
      {b.map(([i,t,d,c])=>(

  const st=[['Escolha','seu kit ou os materiais que quer','🛍️'],['Aprenda','assistindo aos vídeos do curso','🎬'],['Pratique','com material profissional','💅'],['Complete','todas as aulas até o final','✅'],['Receba','seu certificado de conclusão','🏅'],['Comece','sua nova carreira!','🚀']];

      <div className="grid c6" style={{gap:14}}>
        {st.map(([t,d,i],k)=>(

            <Tilt strength={14}><b style={{color:'var(--rose)',fontSize:13}}>0{k+1}</b><h3 style={{margin:'4px 0 6px',fontSize:18}}>{t}</h3><p style={{fontSize:13}}>{d}</p></Tilt>

const SLIDES=[S1,S2,S3,S4,S5,S6,S7,S8,S9,S10];
const LEDS=['#f0a9bf','#f0a9bf','#8ec5ff','#7ef0c3','#7ef0c3','#ffd98a','#ffd98a','#ff5b78','#d9708f','#f0a9bf'];

function App(){
  const [[idx,dir],setPage]=useState([0,1]);
  const go=n=>setPage(([i])=>{const x=Math.max(0,Math.min(SLIDES.length-1,n));return [x,x>=i?1:-1]});
  const step=d=>setPage(([i])=>{const x=Math.max(0,Math.min(SLIDES.length-1,i+d));return x===i?[i,d]:[x,d]});
  const [scale,setScale]=useState(1);
  const mx=useMotionValue(0),my=useMotionValue(0);
  const px=useSpring(mx,{stiffness:40,damping:20}),py=useSpring(my,{stiffness:40,damping:20});

  useEffect(()=>{const f=()=>setScale(Math.min(innerWidth/1280,innerHeight/720));f();addEventListener('resize',f);return()=>removeEventListener('resize',f)},[]);
  useEffect(()=>{
    const k=e=>{
      const key=e.key;
      if(key==='f'||key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});return}
      if(key===' '){e.preventDefault();step(e.shiftKey?-1:1)}
      else if(['ArrowRight','ArrowDown','PageDown'].includes(key)){e.preventDefault();step(1)}
      else if(['ArrowLeft','ArrowUp','PageUp'].includes(key)){e.preventDefault();step(-1)}
      else if(key==='Home')go(0);else if(key==='End')go(9);
    };
    addEventListener('keydown',k);return()=>removeEventListener('keydown',k);
  },[]);
  useEffect(()=>{const m=e=>{mx.set((e.clientX/innerWidth-.5)*-60);my.set((e.clientY/innerHeight-.5)*-40)};addEventListener('mousemove',m);return()=>removeEventListener('mousemove',m)},[]);

  const Cur=SLIDES[idx];
  return (
    <div id="stage" style={{transform:`translate(-50%,-50%) scale(${scale})`}}>
      <div className="bg-grid"/>
      <motion.div className="orb" style={{x:px,y:py,width:420,height:420,left:-80,top:-100,background:'rgba(217,112,143,.32)'}} animate={{scale:[1,1.2,1]}} transition={{duration:9,repeat:Infinity}}/>
      <motion.div className="orb" style={{x:py,y:px,width:380,height:380,right:-100,bottom:-120,background:'rgba(142,197,255,.16)'}} animate={{scale:[1.1,.9,1.1]}} transition={{duration:11,repeat:Infinity}}/>

      <AnimatePresence mode="wait" custom={dir}>
        <motion.div key={idx} className="scene" custom={dir} variants={shell} initial="enter" animate="center" exit="exit">
          <Cur/>
        </motion.div>
      </AnimatePresence>

      <div className="hud">
        <span style={{opacity:.7}}>F tela cheia · espaço / setas para navegar</span>
        <div className="nav">
          <button className="arrow" onClick={()=>step(-1)}>‹</button>
          {SLIDES.map((_,i)=><motion.button key={i} className="dot" onClick={()=>go(i)} animate={{scale:i===idx?1.5:1,background:i===idx?LEDS[i]:'rgba(255,255,255,.2)'}}/>)}
          <button className="arrow" onClick={()=>step(1)}>›</button>
        </div>
        <span>{idx+1} / {SLIDES.length}</span>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
